name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 태그와 package.json·Cargo.toml 의 판이 다르면 latest.json 이 실제와 다른 판을 알려, 설치된 런처가
  # 같은 판을 계속 다시 받거나 새 판을 모르고 지나간다. 빌드에 들어가기 전에 여기서 멈춘다
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$tag" != "$package" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::tag $tag, package.json $package and Cargo.toml $cargo must agree"
            exit 1
          fi
      - name: Create a draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # 만든 직후의 릴리스 목록에는 draft 가 아직 없을 수 있다. id 가 비면 tauri-action 이 빌드만 하고 아무것도
        # 올리지 않은 채 성공하므로, 만드는 응답에서 id 를 받고 비었으면 여기서 멈춘다
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="HyperFarm Launcher $GITHUB_REF_NAME" \
            -F draft=true -F generate_release_notes=true --jq .id)
          if [ -z "$id" ]; then
            echo "::error::the draft release has no id"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Add the macOS targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # 서명이 ad-hoc 이면 designated requirement 가 없어 TCC 가 저장한 마이크 허용을 다음 요청에서 검증하지 못하고
      # 매번 다시 묻는다. 고정 인증서로 서명하면 requirement 가 그 인증서에 묶여 업데이트 뒤에도 허용이 남는다.
      # tauri 의 APPLE_CERTIFICATE 는 Apple 이 발급한 이름(Developer ID Application: 등)의 인증서만 찾으므로 자체 서명
      # 인증서는 여기서 keychain 에 넣고, tauri 에는 APPLE_SIGNING_IDENTITY 만 넘겨 앱 서명 뒤 updater 아티팩트를 만들게 한다
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          base64 --decode <<< "$MACOS_SIGNING_CERTIFICATE" > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -p codesigning "$keychain" | awk '/"HyperFarm Launcher"/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::the signing certificate has no HyperFarm Launcher identity"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/HyperFarm.app"
          codesign --verify --deep --strict "$app"
          expected="certificate root = H\"$(tr '[:upper:]' '[:lower:]' <<< "$APPLE_SIGNING_IDENTITY")\""
          codesign -d -r- "$app" 2>&1 | grep -F "$expected" ||
            { echo "::error::the app is not bound to the signing certificate"; exit 1; }

  # 웹의 받기 단추와 런처의 자동 업데이트가 pack.hyperf.kr/launcher/ 의 고정 이름을 본다(hyperfarm-web 의
  # src/lib/launcher.ts, tauri.conf.json 의 updater). 판마다 releases/<판>/ 에 남긴 뒤 고정 이름을 그 판으로 올리므로
  # rollback.yml 이 옛 판을 다시 올릴 수 있다
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: s3://${{ secrets.R2_BUCKET }}/launcher
      ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      PUBLIC_BASE: https://pack.hyperf.kr/launcher
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the release
        run: |
          mkdir release
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "release/$name"
            done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body > release/notes.md
          ls -l release
          test -s release/latest.json
          scripts/check-latest.sh release/latest.json
      - name: Publish to R2
        run: scripts/publish-launcher.sh release "${GITHUB_REF_NAME#v}"
      - name: Check what players get
        run: |
          curl -sf -A "hyperfarm-launcher/ci" "$PUBLIC_BASE/latest.json" -o "$RUNNER_TEMP/latest.json"
          scripts/check-latest.sh "$RUNNER_TEMP/latest.json"
          [ "$(jq -r .version "$RUNNER_TEMP/latest.json")" = "${GITHUB_REF_NAME#v}" ]
          for url in $(jq -r '.platforms[].url' "$RUNNER_TEMP/latest.json" | sort -u); do
            curl -sfI -A "hyperfarm-launcher/ci" "$url" >/dev/null
          done
      - name: Publish the release
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq .html_url
