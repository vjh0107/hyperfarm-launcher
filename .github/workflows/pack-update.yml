name: Pack update

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-update
  cancel-in-progress: false

jobs:
  # pack/sources.json 을 다시 풀어 모드가 새 판으로 바뀌었으면 PR 을 연다. GITHUB_TOKEN 으로 연 PR 의 CI 는
  # "승인 필요" 로 멈춰 필수 검사가 채워지지 않으므로, 연 뒤에 그 실행을 승인한다
  propose:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: pack/update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp pack/manifest.json "$RUNNER_TEMP/manifest.before.json"
      - run: python3 pack/resolve.py
      - run: python3 pack/check.py
      - name: Open or update the pull request
        run: |
          if git diff --quiet -- pack/manifest.json; then
            echo "The pack is up to date"
            exit 0
          fi
          python3 pack/summary.py "$RUNNER_TEMP/manifest.before.json" pack/manifest.json > "$RUNNER_TEMP/changes.md"
          {
            echo "## 바꾼 것"
            echo
            echo "\`pack/sources.json\` 을 다시 풀었더니 아래가 새 판으로 바뀌었다."
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "## 검증"
            echo
            echo "- [ ] \`installs_and_opens_the_game_window\` 로 게임이 뜨는지 봤다"
            echo "- [ ] 쉐이더를 켜고 서버에 들어가 화면이 깨지지 않는지 봤다"
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "모드를 새 판으로 올린다"
          git push -qf origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main --title "모드를 새 판으로 올린다" \
              --body-file "$RUNNER_TEMP/body.md" --label pack
          fi
          head=$(git rev-parse HEAD)
          for _ in $(seq 1 12); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&status=action_required" --jq '.workflow_runs[].id')
            [ -n "$pending" ] && break
            sleep 5
          done
          for id in $pending; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
          done
          [ -n "$pending" ] || echo "::warning::no CI run waits for approval; approve it on the pull request"
