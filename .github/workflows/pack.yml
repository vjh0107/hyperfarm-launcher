name: Pack

on:
  push:
    branches: [main]
    paths: [pack/manifest.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 pack/check.py
      - name: Upload the pack manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >
          aws s3 cp pack/manifest.json "s3://${{ secrets.R2_BUCKET }}/launcher/manifest.json"
          --endpoint-url "${{ secrets.R2_ENDPOINT }}" --cache-control "no-cache"
